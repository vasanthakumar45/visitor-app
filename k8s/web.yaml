apiVersion: apps/v1
kind: Deployment
metadata:
  name: visitor-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: visitor-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: visitor-app
    spec:
      containers:
        - name: visitor-app
          image: vasanth45/visitor-app:v1
          ports:
            - containerPort: 5000
          env:
            - name: REDIS_HOST
              value: redis
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: visitor-app
spec:
  type: NodePort
  selector:
    app: visitor-app
  ports:
    - port: 80
      targetPort: 5000
